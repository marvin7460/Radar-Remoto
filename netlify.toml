# Netlify detects Next.js and applies its OpenNext adapter automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's persistent build cache snapshots server env values; it is never
  # deployed, so keep it out of secrets scanning (client bundles are still scanned).
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"
